<!doctype html>
<html lang="en">
<head>
    <title>Floating Point to Hex Converter - Tests</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1" />
    <link rel="stylesheet" href="https://unpkg.com/mocha/mocha.css">
    <script type="module">
      // Use ES module import syntax to import functionality from the module
      // that we have compiled.
      //
      // Note that the `default` import is an initialization function which
      // will "boot" the module and make it ready to use. Currently browsers
      // don't support natively imported WebAssembly as an ES module, but
      // eventually the manual initialization won't be required!
      import init, { hexfloatcgi } from '../pkg/floattohexlib_bindgen.js';

      async function run() {
        // First up we need to actually load the Wasm file, so we use the
        // default export to inform it where the Wasm file is located on the
        // server, and then we wait on the returned promise to wait for the
        // Wasm to be loaded.
        //
        // It may look like this: `await init('./pkg/without_a_bundler_bg.wasm');`,
        // but there is also a handy default inside `init` function, which uses
        // `import.meta` to locate the Wasm file relatively to js file.
        //
        // Note that instead of a string you can also pass in any of the
        // following things:
        //
        // * `WebAssembly.Module`
        //
        // * `ArrayBuffer`
        //
        // * `Response`
        //
        // * `Promise` which returns any of the above, e.g. `fetch("./path/to/wasm")`
        //
        // This gives you complete control over how the module is loaded
        // and compiled.
        //
        // Also note that the promise, when resolved, yields the Wasm module's
        // exports which is the same as importing the `*_bg` module in other
        // modes
        await init();

        // And afterwards we can use all the functionality defined in wasm.
        /*const result = hexfloatcgi("action=floattohex&float=4.5&swap=0");
        console.log(`${result}`);*/
        // This makes it easier to call from App.tsx
        window.hexfloatcgi = hexfloatcgi;
      }

      window.loadPromise = run();
    </script>
 
</head>
<body>
    <div id="mocha"></div>

    <script src="https://cdn.jsdelivr.net/npm/mocha@11.8.0/mocha.js"></script>
    <script type="module">
import * as src from '../index.js';
import * as chai from 'https://cdn.jsdelivr.net/npm/chai@5/+esm';
const { expect } = chai;

/*
 * Modeled after fixture() from @open-wc/testing
 * Need to be in the DOM to test for example `connectedCallback()` on elements.
 */
let cleanupNodes = [];
function fixture(html) {
    let parentNode = document.createElement('div');
    document.body.appendChild(parentNode);
    cleanupNodes.push(parentNode);
    parentNode.innerHTML = html;
    return parentNode.children[0];
}
function cleanup() {
    for (let node of cleanupNodes) {
        document.body.removeChild(node);
    }
    cleanupNodes = [];
}

mocha.setup("bdd");

describe("default render", function() {
    it('renders without crashing', () => {
        let f = fixture(`<float-to-hex-app>
            <hex-converter floatingPointType="float"></hex-converter>
            <hex-converter floatingPointType="double"></hex-converter>
            <hex-converter floatingPointType="float16"></hex-converter>
            <hex-converter floatingPointType="bfloat16"></hex-converter>
        </float-to-hex-app>`);
        expect(f).to.not.be.undefined;
        cleanup();
    });
});

function setupHexConverter(converter, hexValue) {
    converter.setAttribute("hexvalue", hexValue);
    converter.setAttribute("calculatedhexvalue", "0x40900000");
    converter.setAttribute("floatingvalue", "0");
    converter.setAttribute("calculatedfloatingvalue", "0");
    converter.setAttribute("coercedfromfloatingvalue", "");
    converter.setAttribute("showalldetails", "true");
}

describe("denormalized switching", function() {
    it('switching from non-denormalized to denormalized zeros', async () => {
        await window.loadPromise;
        let f = fixture(`<hex-converter floatingPointType="float"></hex-converter>`);
        setupHexConverter(f, "0x40900000");
        await new Promise((res) => res());
        f.setAttribute("hexvalue", "0x00000000");
        await new Promise((res) => res());
        f.shadowRoot.getElementById("convertToFloatButton").click();
        await new Promise((res) => res());
        let breakdown = f.shadowRoot.querySelector("hex-float-breakdown");
        let row = breakdown.shadowRoot.getElementById("breakdownRow0");
        expect(row.children[1].innerHTML).to.equal("0 <b>subnormal</b>");

        cleanup();
    });
    it('switching from non-denormalized to denormalized ones', async () => {
        await window.loadPromise;
        let f = fixture(`<hex-converter floatingPointType="float"></hex-converter>`);
        setupHexConverter(f, "0x40900000");
        await new Promise((res) => res());
        f.setAttribute("hexvalue", "0x7ff00000");
        await new Promise((res) => res());
        f.shadowRoot.getElementById("convertToFloatButton").click();
        await new Promise((res) => res());
        let breakdown = f.shadowRoot.querySelector("hex-float-breakdown");
        let row = breakdown.shadowRoot.getElementById("breakdownRow0");
        expect(row.children[1].innerHTML).to.equal("255 <b>special</b>");

        cleanup();
    });
    it('switching from denormalized zeros to non-denormalized', async () => {
        await window.loadPromise;
        let f = fixture(`<hex-converter floatingPointType="float"></hex-converter>`);
        setupHexConverter(f, "0x00000000");
        await new Promise((res) => res());
        f.setAttribute("hexvalue", "0x40900000");
        await new Promise((res) => res());
        f.shadowRoot.getElementById("convertToFloatButton").click();
        await new Promise((res) => res());
        let breakdown = f.shadowRoot.querySelector("hex-float-breakdown");
        let row = breakdown.shadowRoot.getElementById("breakdownRow0");
        expect(row.children[1].innerHTML).to.equal("129");

        cleanup();
    });
    it('switching from denormalized ones to non-denormalized', async () => {
        await window.loadPromise;
        let f = fixture(`<hex-converter floatingPointType="float"></hex-converter>`);
        setupHexConverter(f, "0x7ff00000");
        await new Promise((res) => res());
        f.setAttribute("hexvalue", "0x40900000");
        await new Promise((res) => res());
        f.shadowRoot.getElementById("convertToFloatButton").click();
        await new Promise((res) => res());
        let breakdown = f.shadowRoot.querySelector("hex-float-breakdown");
        let row = breakdown.shadowRoot.getElementById("breakdownRow0");
        expect(row.children[1].innerHTML).to.equal("129");

        cleanup();
    });


});

mocha.run();
</script>

</body>
</html>
